function javaA(code){const L=code.split('\n'),out=[],add=(k,line,fix,cd=true,sev='er')=>out.push({k,line,fix,cd,sev,lang:'Java',bad:line?L[line-1]:''});

 const decl={},nulls={};let arr=null;
 L.forEach((raw,i)=>{const s=raw.trim(),n=i+1,ind=raw.match(/^\s*/)[0];if(!s||s.startsWith('//'))return;
  let m;if(m=s.match(/^(int|double|float|long|boolean|char|String)\s+(\w+)\s*;/))decl[m[2]]=n;
  if(m=s.match(/^(\w+)\s*=[^=]/))delete decl[m[1]];
  if(m=s.match(/^String\s+(\w+)\s*=\s*null/))nulls[m[1]]=n;
  if(!/[;{}]\s*$/.test(s)&&!/^(if|for|while|else|@|\*|\/\*)/.test(s)&&!/,$/.test(s)&&/[\w\)"\]]$/.test(s))add('sc',n,ind+s+';');
  if(/if\s*\([^=!<>]*[^=!<>]=[^=][^)]*\)/.test(s)&&!/==/.test(s))add('asg',n,ind+s.replace(/([^=!<>])=([^=])/,'$1==$2'));
  if(/\w+\s*==\s*"/.test(s)&&/if|while/.test(s))add('streq',n,ind+s.replace(/(\w+)\s*==\s*("[^"]*")/,'$1.equals($2)'),true,'wa');
  if(/^int\s+\w+\s*=\s*"/.test(s))add('tipo',n,ind+s.replace(/^int/,'String'));
  if(/^String\s+\w+\s*=\s*-?\d+\s*;/.test(s))add('tipo',n,ind+s.replace(/=\s*(-?\d+)/,'= "$1"'));
  if((m=s.match(/(\w+)\s*\.\s*(length|equals|charAt|toUpperCase)\b/))&&nulls[m[1]]&&nulls[m[1]]<n)add('nul',n,ind+'if ('+m[1]+' != null) '+s);
  if((m=s.match(/(\w+)\s*\[\s*(\w+)\.length\s*\]/))&&m[1]===m[2])add('idx',n,ind+s.replace(/\.length\s*\]/,'.length - 1]'));
  if(/for\s*\(.*<=\s*\w+\.length/.test(s))add('idx',n,ind+s.replace('<=','<'));
  if(m=s.match(/new\s+int\s*\[\s*(\d+)\s*\]/))arr=+m[1];
  if((m=s.match(/\w+\s*\[\s*(\d+)\s*\]\s*=/))&&arr!==null&&+m[1]>=arr)add('idx',n,ind+s.replace(/\[\s*\d+\s*\]/,'['+(arr-1)+']'));
  if((m=s.match(/(?:println|print)\s*\(\s*(\w+)\s*\)/))&&decl[m[1]]&&decl[m[1]]<n)add('ini',decl[m[1]],L[decl[m[1]]-1].replace(/;/,' = 0;'));});
 return out}
function sqlA(code){const out=[],s=code.trim(),u=s.toUpperCase(),f=(u.match(/^\w+/)||[''])[0],add=(k,fix,cd=true,sev='er')=>out.push({k,line:0,fix,cd,sev,lang:'SQL',bad:s});if(!s)return out;
 const kw=['SELECT','INSERT','UPDATE','DELETE','CREATE','DROP','ALTER'];
 if(!kw.includes(f))add('kw',s.replace(/^\w+/,kw.find(k=>k[0]===f[0])||'SELECT'));
 if(f==='SELECT'&&!/\bFROM\b/.test(u))add('from','SELECT ... FROM tabla;',false);
 if(/,\s*FROM\b/.test(u))add('coma',s.replace(/,\s*FROM/i,' FROM'));
 if(/[=<>]\s*NULL\b/.test(u))add('isnull',s.replace(/(!=|<>)\s*NULL/i,'IS NOT NULL').replace(/=\s*NULL/i,'IS NULL'));
 if((s.match(/'/g)||[]).length%2)add('comi',"Cierra la comilla simple que falta",false);
 if((s.match(/\(/g)||[]).length!==(s.match(/\)/g)||[]).length)add('par','Agrega el paréntesis que falta',false);
 if((f==='UPDATE'||f==='DELETE')&&!/\bWHERE\b/.test(u))add('where',s.replace(/;?$/,' WHERE condicion;'),true,'wa');

 if(!/;\s*$/.test(s))add('semi',s+';',true,'wa');return out}

 return `<div class="c"><h2>👤 ${esc(me.nombre)}</h2><p class="mu">${esc(me.correo)} · ${me.rol}</p>${me.rol==='estudiante'?`<label>Nivel de conocimiento</label><select onchange="me.nivelConocimiento=this.value;persist();sync();render()">${NIV.map(n=>`<option ${n===me.nivelConocimiento?'selected':''}>${n}</option>`).join('')}</select>`:''}<label>Cambiar contraseña</label><div class="row"><input id="np" type="password" placeholder="Nueva contraseña (mín. 6)"><button onclick="cambiarClave()">Actualizar</button></div><p id="pm" class="mu"></p></div>
 ${me.rol==='estudiante'?`<div class="g"><div class="c kpi"><b>${I.length}</b>Incidencias</div><div class="c kpi"><b>${I.length?pct+'%':'—'}</b>Resueltas</div><div class="c kpi"><b>${ap}/${tot}</b>Ejercicios aprobados</div><div class="c kpi"><b>${ap?prom:'—'}</b>Puntaje promedio</div></div>
 <div class="c"><h3>Indicadores de avance</h3>${I.length?`<p>Incidencias resueltas: ${res}/${I.length}</p><div class="bar"><i style="width:${pct}%"></i></div>`:'<p class="mu">Incidencias: pendiente de datos.</p>'}<p>Ejercicios aprobados: ${ap}/${tot}</p><div class="bar"><i style="width:${tot?ap/tot*100:0}%"></i></div><h3 style="margin-top:14px">Categorías de error más frecuentes</h3>${tc.length?tc.map(([c,v])=>`<div>• ${esc(c.nombre)} <span class="mu">×${v}</span></div>`).join(''):'<p class="mu">Pendiente de datos: aún no hay errores clasificados.</p>'}<p><button class="p" onclick="tab='ch';cs='su';ch=null;render()">🎯 Ver recomendaciones de práctica</button></p></div>`:''}`}
async function cambiarClave(){const p=$('#np').value;if(p.length<6)return $('#pm').textContent='La contraseña debe tener al menos 6 caracteres.';me.claveHash=await hash(p);persist();$('#np').value='';$('#pm').textContent='✅ Contraseña actualizada.'}
// ===== Administración (CU-07, RF-12, RN-10, RN-12) =====
const FD={CategoriaError:[['nombre','Nombre','t',1],['descripcion','Descripción (causa del error)','a',1],['lenguaje','Lenguaje','s',1,['Java','SQL']],['tipo','Tipo de error','s',1,['Sintaxis','Ejecución','Lógica']],['concepto','Concepto relacionado','t'],['patron','Patrón del mensaje de error (expresión regular)','t']],
Explicacion:[['idCategoria','Categoría','c',1],['nivel','Nivel','s',1,NIV],['contenido','Contenido de la explicación','a',1],['recomendacion','Recomendación','a'],['ejemplo','Ejemplo correcto','a']],
Ejercicio:[['titulo','Título','t',1],['lenguaje','Lenguaje','s',1,['Java','SQL']],['dificultad','Dificultad','s',1,['Fácil','Intermedio','Difícil']],['idCategoria','Categoría relacionada','c'],['enunciado','Enunciado','a',1],['codigo','Código con error','a',1],['respuestaEsperada','Respuesta esperada (correcta)','a',1],['distractores','Respuestas incorrectas, separadas por ||','a',1],['criterio','Criterio de evaluación','a']]};
const LBL={CategoriaError:r=>r.nombre+' ('+r.lenguaje+')',Explicacion:r=>(cat(r.idCategoria)||{nombre:'?'}).nombre+' · '+r.nivel,Ejercicio:r=>r.titulo+' ('+r.lenguaje+', '+r.dificultad+')'};
function admV(){if(me.rol!=='administrador')return '<div class="c"><h2>⛔ Acceso denegado</h2><p>Solo el administrador puede acceder a esta sección (RN-12).</p></div>';
 const T=[['resumen','Resumen'],['Usuario','Usuarios'],['CategoriaError','Categorías de error'],['Explicacion','Explicaciones'],['Ejercicio','Ejercicios'],['db','Base de datos']];
 return `<div class="c"><h2>🛠️ Panel de administración</h2><div class="row" style="gap:6px">${T.map(t=>`<button class="${asub===t[0]?'p':''}" onclick="asub='${t[0]}';fm={t:'${t[0]}',id:null,v:{},err:''};render()">${t[1]}</button>`).join('')}</div></div>`+({resumen:resV2,Usuario:usrV,db:dbV})[asub]?.()||crudV(asub)}
function resV2(){const n=t=>DB[t].length;return `<div class="g">${['Usuario','CategoriaError','Explicacion','Ejercicio','Incidencia','ResultadoPractica'].map(t=>`<div class="c kpi"><b>${n(t)}</b>${t}</div>`).join('')}</div><div class="c"><p class="mu">Las tablas siguen el modelo lógico del informe (apartado 3.4.2). Los cambios que hagas en categorías, explicaciones y ejercicios se aplican de inmediato a los estudiantes de este navegador.</p></div>`}
function usrV(){return `<div class="c"><h3>Usuarios</h3><div style="overflow-x:auto"><table><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Nivel</th><th></th></tr>${DB.Usuario.map(u=>`<tr><td>${u.idUsuario}</td><td>${esc(u.nombre)}</td><td>${esc(u.correo)}</td><td><select onchange="setU(${u.idUsuario},'rol',this.value)">${['estudiante','administrador'].map(r=>`<option ${u.rol===r?'selected':''}>${r}</option>`).join('')}</select></td><td>${u.rol==='estudiante'?`<select onchange="setU(${u.idUsuario},'nivelConocimiento',this.value)">${NIV.map(n=>`<option ${u.nivelConocimiento===n?'selected':''}>${n}</option>`).join('')}</select>`:'—'}</td><td>${u.idUsuario===me.idUsuario?'(tú)':`<button onclick="delU(${u.idUsuario})">🗑️</button>`}</td></tr>`).join('')}</table></div></div>`}
function setU(id,k,v){const u=DB.Usuario.find(x=>x.idUsuario===id);if(k==='rol'&&v!=='administrador'&&u.rol==='administrador'&&DB.Usuario.filter(x=>x.rol==='administrador').length<2){toast('Debe existir al menos un administrador');return render()}u[k]=v;if(k==='rol')u.nivelConocimiento=v==='estudiante'?(u.nivelConocimiento||'Principiante'):null;persist();render()}
function delU(id){if(!confirm('¿Eliminar este usuario y su historial?'))return;DB.Usuario=DB.Usuario.filter(u=>u.idUsuario!==id);['Incidencia','ResultadoPractica'].forEach(t=>DB[t]=DB[t].filter(r=>r.idUsuario!==id));persist();render()}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function crudV(t){const F=FD[t],rows=DB[t],pk=PK[t];if(fm.t!==t)fm={t,id:null,v:{},err:''};
 const inp=f=>{const[n,l,ty,rq,op]=f,v=fm.v[n]??'';return `<label>${l}${rq?' *':''}</label>`+(ty==='a'?`<textarea style="min-height:70px" oninput="fm.v['${n}']=this.value">${esc(v)}</textarea>`:ty==='s'?`<select onchange="fm.v['${n}']=this.value"><option value="">— elegir —</option>${op.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:ty==='c'?`<select onchange="fm.v['${n}']=this.value?+this.value:null"><option value="">— ninguna —</option>${DB.CategoriaError.map(c=>`<option value="${c.idCategoria}" ${v===c.idCategoria?'selected':''}>${esc(c.nombre)} (${c.lenguaje})</option>`).join('')}</select>`:`<input value="${esc(v)}" oninput="fm.v['${n}']=this.value">`)};
 return `<div class="c"><h3>${t==='CategoriaError'?'Categorías de error':t==='Explicacion'?'Explicaciones':'Ejercicios'} (${rows.length})</h3><div style="max-height:260px;overflow:auto">${rows.map(r=>`<div class="step"><span style="flex:1">#${r[pk]} · ${esc(LBL[t](r))}</span><button onclick="crudEd('${t}',${r[pk]})">✏️</button><button onclick="crudDel('${t}',${r[pk]})">🗑️</button></div>`).join('')||'<p class="mu">Sin registros.</p>'}</div></div>
 <div class="c"><h3>${fm.id?'Editar registro #'+fm.id:'Nuevo registro'}</h3>${F.map(inp).join('')}<p style="color:var(--er)">${esc(fm.err)}</p><button class="p" onclick="crudSave('${t}')">Guardar</button> <button onclick="fm={t:'${t}',id:null,v:{},err:''};render()">Limpiar</button></div>`}
function crudEd(t,id){fm={t,id,v:{...DB[t].find(r=>r[PK[t]]===id)},err:''};render()}
function crudSave(t){const F=FD[t],v=fm.v,miss=F.filter(f=>f[3]&&(v[f[0]]===undefined||v[f[0]]===null||String(v[f[0]]).trim()==='')).map(f=>f[1]);if(miss.length){fm.err='Datos incompletos: completa '+miss.join(', ')+'.';return render()}
 if(t==='CategoriaError'&&v.patron){try{new RegExp(v.patron)}catch(e){fm.err='El patrón no es una expresión regular válida.';return render()}}
 if(t==='Ejercicio'&&v.distractores.split('||').filter(Boolean).length<2){fm.err='Ingresa al menos 2 respuestas incorrectas separadas por ||.';return render()}
 if(fm.id){Object.assign(DB[t].find(r=>r[PK[t]]===fm.id),v);persist()}else ins(t,{...v});fm={t,id:null,v:{},err:''};toast('✅ Guardado');render()}
function crudDel(t,id){if(!confirm('¿Eliminar este registro?'))return;DB[t]=DB[t].filter(r=>r[PK[t]]!==id);if(t==='CategoriaError'){DB.Explicacion=DB.Explicacion.filter(e=>e.idCategoria!==id);DB.Ejercicio.forEach(e=>{if(e.idCategoria===id)e.idCategoria=null});DB.Incidencia.forEach(i=>{if(i.idCategoria===id)i.idCategoria=null})}if(t==='Ejercicio')DB.ResultadoPractica=DB.ResultadoPractica.filter(r=>r.idEjercicio!==id);persist();render()}
function dbV(){const rows=DB[dbv],cols=rows[0]?Object.keys(rows[0]).filter(k=>k!=='claveHash'):[PK[dbv]];return `<div class="c"><h3>Base de datos (modelo lógico)</h3><div class="row"><select onchange="dbv=this.value;render()">${Object.keys(PK).map(t=>`<option ${dbv===t?'selected':''}>${t}</option>`).join('')}</select><button onclick="csvT()">⬇️ Exportar CSV</button></div><p class="mu">${rows.length} registro(s). La clave de los usuarios se guarda cifrada y no se muestra.</p><div style="overflow:auto;max-height:380px"><table style="font-size:12px"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.slice(0,100).map(r=>`<tr>${cols.map(c=>`<td>${esc(String(r[c]??'').slice(0,60))}</td>`).join('')}</tr>`).join('')}</table></div></div>`}
function csvT(){const rows=DB[dbv];if(!rows.length)return toast('La tabla está vacía');const cols=Object.keys(rows[0]).filter(k=>k!=='claveHash'),q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',txt='\ufeff'+[cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=dbv+'.csv';document.body.appendChild(a);a.click();a.remove()}

(async function boot(){if(!DB){DB=seedDB();DB.Usuario.push({idUsuario:1,nombre:'Administrador',correo:'admin@debugu.pe',claveHash:await hash('Admin2026'),rol:'administrador',nivelConocimiento:null,fechaRegistro:new Date().toISOString().slice(0,10)});DB.seq.Usuario=1;persist()}
 const s=st.get('dbg_sess');if(s)me=DB.Usuario.find(u=>u.idUsuario===s)||null;if(me)tab=me.rol==='administrador'?'adm':'an';render()})();
</script></body></html>
